# GitFlic CI/CD — автоматические ворота для всех веток (порт .github/workflows/ci.yml
# из main, 2fe03a2). Зелёный CI — обязательное условие приёмки (AGENTS_WORKFLOW §5).
#
# Выполняется self-hosted агентом pc1-hermes (Windows, executor=powershell),
# зарегистрированным на проекте motor2 (GitFlic SaaS, облачных агентов нет).
# Окружение агента = ПК-1: STM32CubeCLT тулчейн (export PATH в Makefile),
# WinLibs gcc для hosted-тестов, QEMU из C:/ST, pytest в py -3.
#
# ОГРАНИЧЕНИЯ powershell-executor (проверено 27.08.2026):
#  - каждая команда script — ОДНА строка PowerShell (многострочные блоки - |
#    вешают агента: незакрытая конструкция ждёт продолжения);
#  - русский текст в командах — кракозябры (кодировка); только ASCII;
#  - ':' внутри plain-строки ломает YAML-парсер — команды с ':' в кавычках;
#  - конфиг должен повторять .github/workflows/ci.yml из main (не из веток).

stages:
  - build

build-test:
  stage: build
  script:
    # ── Main push audit (AGENTS_WORKFLOW §1): прямой push в main без merge-коммита
    #    приёмки = красный рана. В GitFlic CI ветка — в $env:CI_COMMIT_REF_NAME.
    - 'if ($env:CI_COMMIT_REF_NAME -eq "main" -and ((git log --format=%p -1 HEAD).Split(" ").Count -lt 2)) { Write-Error "Main push audit FAILED - direct push to main (AGENTS_WORKFLOW.md sec 1)"; exit 1 }'
    # ── Production build (Makefile сам знает путь к тулчейну: export PATH) ──
    - make
    # ── Hosted + QEMU + pytest tests ──
    - make test
    # ── Test3 G0 enforcement regression (порт из GitHub ci.yml) ──
    - py -3 -m py_compile tools/test2_test3_route_check.py tools/test3_build_provenance_check.py tools/test3_build_provenance_emit.py tools/test3_g0_gate.py
    - py -3 -m pytest -q tests/test_test2_test3_route_check.py tests/test_test3_g0_enforcement_spec.py tests/test_test3_g0_scope_security_cases.py tests/test_test3_build_provenance_check.py tests/test_test3_build_provenance_emit.py tests/test_test3_g0_gate.py
    # ── Map artifact writer + pipeline regression (hosted standalone) ──
    - make -f tools/map_artifact_writer_test.mk map-artifact-test
    - make -f tools/map_artifact_writer_test.mk map-artifact-pipeline-test
    - make -f tools/map_artifact_writer_test.mk map-artifact-e2e
    - make -f tools/map_characterization_e2e_test.mk map-characterization-e2e-test
    # ── Map capture profile regression (synthetic host-only) ──
    # ВАЖНО: CC=gcc явно — у make дефолт CC=cc, которого нет на Windows.
    - make -f tests/map_capture_profile_test.mk map-capture-profile-test CC=gcc
    - make -f tests/map_capture_profile_test.mk map-capture-profile-default-test CC=gcc
    # ── Commissioning build (default-deny off) + production build заново ──
    - make clean
    - make EXTRA_CFLAGS="-DOEW_MAP_CAPTURE=1 -DOEW_MAP_L3=1 -DPWM_OEW_BOARD_REVISION=7"
    - mkdir build-commissioning
    - copy build\firmware.bin build-commissioning\firmware.bin
    - copy build\firmware.elf build-commissioning\firmware.elf
    - copy build\firmware.map build-commissioning\firmware.map
    - python tools/test3_build_provenance_emit.py --campaign-root build-commissioning --source-sha (git rev-parse HEAD) --firmware build-commissioning\firmware.bin
    - python tools/test3_build_provenance_check.py build-commissioning
    - make clean
    - make
  artifacts:
    # name без переменных: GitFlic не подставляет $CI_COMMIT_* в name (артефакт
    # получает имя firmware-<jobid>.tar.gz автоматически)
    expire_in: 1 year
    paths:
      - build/firmware.bin
      - build/firmware.elf
      - build/firmware.map
      - build-commissioning/firmware.bin
      - build-commissioning/firmware.elf
      - build-commissioning/firmware.map
      - build-commissioning/diagnostic_build.log
      - build-commissioning/diagnostic_build_manifest.json
