# OpenOCD config for Nucleo-G474RE (ST-Link/V3)
#
# Требует OpenOCD со стеком DAP (например, xPack OpenOCD 0.12.0-7 из
# toolchain/): интерфейс stlink.cfg там использует драйвер st-link
# (dapdirect), поэтому транспорт — обычный swd, а не hla_swd (hla в этой
# сборке не собран).
source [find interface/stlink.cfg]
transport select swd
source [find target/stm32g4x.cfg]

# Скорость SWD
adapter speed 4000

# Сброс через SYSRESETREQ (SRST на Nucleo не разведён на отладчик),
# поэтому srst_nogate оставляем от target/stm32g4x.cfg — не переопределяем.
