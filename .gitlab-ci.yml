# GitLab CI/CD — автоматические ворота (порт .github/workflows/ci.yml)

# Зелёный CI — обязательное условие приёмки (docs/AGENTS_WORKFLOW.md §5).
# Активируется после миграции на GitLab.com (см. docs/GITLAB_MIGRATION.md).
# До миграции работает GitHub Actions (.github/workflows/ci.yml) — этот файл
# GitHub игнорирует, GitLab игнорирует .github/workflows — конфликта нет.

# ВНИМАНИЕ: free-tier GitLab.com даёт ~400 CI-минут/мес на namespace
# (было 2000, урезано в 2024). Один прогон ≈ 7-10 мин. Следить за расходом:
# Settings → CI/CD → Pipelines (или Usage Quotas). При нехватке — см.
# docs/GITLAB_MIGRATION.md §7 (лимиты).

stages:
  - build

build-test:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update
  script:
    # ── Main push audit (AGENTS_WORKFLOW §1): прямой push в main без merge-коммита
    #    приёмки = красный рана. В GitLab CI ветка — в $CI_COMMIT_BRANCH.
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        PARENTS=$(git log --format=%p -1 HEAD | wc -w)
        if [ "$PARENTS" -lt 2 ]; then
          echo "::error::Прямой push в main без merge-коммита приёмки (AGENTS_WORKFLOW.md §1/§1a)."
          exit 1
        fi
        echo "main push audit: merge-коммит приёмки OK"
      fi
    # ── Toolchain: arm-none-eabi, QEMU, pytest, Tkinter (в контейнере мы root, sudo не нужен)
    - apt-get install -y gcc-arm-none-eabi qemu-system-arm python3-pytest python3-tk
    - arm-none-eabi-gcc --version | head -1
    - qemu-system-arm --version | head -1
    # ── Normalize Makefile для Linux (CRLF -> LF, убрать Windows PATH) ──
    - sed -i 's/\r$//' Makefile
    - sed -i '/^export PATH :=/d' Makefile
    # ── Production build ──
    - make
    # ── Hosted + QEMU + pytest tests ──
    - make test QEMU=$(command -v qemu-system-arm)
    # ── Map artifact writer + pipeline regression (hosted standalone) ──
    - |
      sed -i 's/\r$//' tools/map_artifact_writer_test.mk
      make -f tools/map_artifact_writer_test.mk map-artifact-test
      make -f tools/map_artifact_writer_test.mk map-artifact-pipeline-test
      make -f tools/map_artifact_writer_test.mk map-artifact-e2e
      sed -i 's/\r$//' tools/map_characterization_e2e_test.mk
      make -f tools/map_characterization_e2e_test.mk map-characterization-e2e-test
    # ── Map capture profile regression (synthetic host-only) ──
    - |
      sed -i 's/\r$//' tests/map_capture_profile_test.mk
      make -f tests/map_capture_profile_test.mk map-capture-profile-test
      make -f tests/map_capture_profile_test.mk map-capture-profile-default-test
    # ── Commissioning build (default-deny off) + production build заново ──
    - make clean
    - make EXTRA_CFLAGS="-DOEW_MAP_CAPTURE=1 -DOEW_MAP_L3=1 -DPWM_OEW_BOARD_REVISION=7"
    - mkdir -p build-commissioning
    - cp build/firmware.bin build-commissioning/firmware.bin
    - cp build/firmware.elf build-commissioning/firmware.elf
    - cp build/firmware.map build-commissioning/firmware.map
    - make clean
    - make
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 year
    paths:
      - build/firmware.bin
      - build/firmware.elf
      - build/firmware.map
      - build-commissioning/firmware.bin
      - build-commissioning/firmware.elf
      - build-commissioning/firmware.map
