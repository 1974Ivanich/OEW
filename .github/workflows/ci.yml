name: build-test

# Ворота стенда: production build → make test (hosted + QEMU + pytest) → образы
# для стенда (commissioning, bench-aperture) + регрессии map capture/артефактов.
# Проверки процесса (G0-гейт, provenance emit/check) убраны — AGENTS.md,
# раздел «Что считается работой».
#
# Триггер — только push в main. Замер за 30 дней (06.10.2026): 446 прогонов,
# из них 368 не на main, 156 — на уже удалённых ветвях, 351 — перекрыты
# следующим пушем в ту же ветку (801 мин из 975 суммарных). Генератором
# вычислительной работы был триггер на каждую ветку, а не объём матрицы:
# все шаги, кроме тестов, вместе занимают 0.3 мин из 4.5.
# Нужен CI на ветке — Actions → Run workflow (workflow_dispatch).

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (arm-none-eabi, QEMU, pytest, Tkinter, scope deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm python3-pytest python3-tk python3-usb python3-numpy
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1

      - name: Normalize Makefile for Linux (CRLF -> LF, drop Windows PATH)
        run: |
          sed -i 's/\r$//' Makefile
          sed -i '/^export PATH :=/d' Makefile

      - name: Production build
        run: make

      - name: Upload production firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware.bin
            build/firmware.elf
            build/firmware.map
          if-no-files-found: error

      - name: Hosted + QEMU + pytest tests
        run: make test QEMU=$(command -v qemu-system-arm)

      - name: Map artifact writer + pipeline regression (hosted standalone)
        run: |
          sed -i 's/\r$//' tools/map_artifact_writer_test.mk
          make -f tools/map_artifact_writer_test.mk map-artifact-test
          make -f tools/map_artifact_writer_test.mk map-artifact-pipeline-test
          make -f tools/map_artifact_writer_test.mk map-artifact-e2e
          sed -i 's/\r$//' tools/map_characterization_e2e_test.mk
          make -f tools/map_characterization_e2e_test.mk map-characterization-e2e-test

      - name: Map capture profile regression (synthetic host-only)
        run: |
          sed -i 's/\r$//' tests/map_capture_profile_test.mk
          make -f tests/map_capture_profile_test.mk map-capture-profile-test
          make -f tests/map_capture_profile_test.mk map-capture-profile-default-test
          make -f tests/map_capture_profile_test.mk map-capture-board-profile-test

      - name: Commissioning build (default-deny off)
        run: |
          make clean
          make EXTRA_CFLAGS="-DOEW_MAP_CAPTURE=1 -DOEW_MAP_L3=1 -DPWM_OEW_BOARD_REVISION=7 -DOEW_MAP_SYNTHETIC_PROFILE=1 -DOEW_HOST_TEST=1 -DOEW_HS1_COMMISSIONING_RELEASE=1"
          mkdir -p build-commissioning
          cp build/firmware.bin build-commissioning/firmware.bin
          cp build/firmware.elf build-commissioning/firmware.elf
          cp build/firmware.map build-commissioning/firmware.map

      - name: Upload commissioning firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-commissioning
          path: |
            build-commissioning/firmware.bin
            build-commissioning/firmware.elf
            build-commissioning/firmware.map
          if-no-files-found: error

      - name: Bench-aperture build (markers, default-deny off)
        run: |
          make clean
          make EXTRA_CFLAGS="-DOEW_MAP_CAPTURE=1 -DOEW_MAP_L3=1 -DPWM_OEW_BOARD_REVISION=7 -DOEW_MAP_SYNTHETIC_PROFILE=1 -DOEW_HOST_TEST=1 -DOEW_HS1_COMMISSIONING_RELEASE=1 -DOEW_BENCH_APERTURE=1"
          mkdir -p build-bench-aperture
          cp build/firmware.bin build-bench-aperture/firmware.bin
          cp build/firmware.elf build-bench-aperture/firmware.elf
          cp build/firmware.map build-bench-aperture/firmware.map

      - name: Upload bench-aperture firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bench-aperture
          path: |
            build-bench-aperture/firmware.bin
            build-bench-aperture/firmware.elf
            build-bench-aperture/firmware.map
          if-no-files-found: error
