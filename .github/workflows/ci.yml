name: build-test

# Автоматические ворота: production build, hosted+QEMU тесты,
# commissioning build, pytest. Зелёный CI — обязательное условие приёмки
# крупных пакетов (docs/AGENTS_WORKFLOW.md §3/§5). Ложные «make PASS» из
# отчётов агентов здесь не проходят — сборка реальная, на Linux.

on:
  push:
    branches:
      - '**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain (arm-none-eabi, QEMU, pytest, Tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm python3-pytest python3-tk
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1

      - name: Normalize Makefile for Linux (CRLF -> LF, drop Windows PATH)
        run: |
          sed -i 's/\r$//' Makefile
          sed -i '/^export PATH :=/d' Makefile

      - name: Production build
        run: make

      - name: Hosted + QEMU + pytest tests
        run: make test QEMU=$(command -v qemu-system-arm)

      - name: Test3 G0 enforcement regression
        run: |
          python3 -m py_compile tools/test2_test3_route_check.py tools/test3_build_provenance_check.py tools/test3_build_provenance_emit.py tools/test3_g0_gate.py tools/bench_test3_preflight.py tools/bench_test3_capture.py tools/bench_test3_g0_check.py tools/bench_test3_rerun_verdict.py tools/bench_test3_campaign_archive.py tools/acs712_nohv_validator.py tools/fill_acs712_nohv_signatures.py tools/boar_campaign_template.py tools/verify_boar_campaign_ready.py
          pytest -q tests/test_test2_test3_route_check.py tests/test_test3_g0_enforcement_spec.py tests/test_test3_g0_scope_security_cases.py tests/test_test3_build_provenance_check.py tests/test_test3_build_provenance_emit.py tests/test_test3_g0_gate.py tests/test_acs712_nohv_validator.py

      - name: Map artifact writer + pipeline regression (hosted standalone)
        run: |
          sed -i 's/\r$//' tools/map_artifact_writer_test.mk
          make -f tools/map_artifact_writer_test.mk map-artifact-test
          make -f tools/map_artifact_writer_test.mk map-artifact-pipeline-test
          make -f tools/map_artifact_writer_test.mk map-artifact-e2e
          sed -i 's/\r$//' tools/map_characterization_e2e_test.mk
          make -f tools/map_characterization_e2e_test.mk map-characterization-e2e-test

      - name: Map capture profile regression (synthetic host-only)
        run: |
          sed -i 's/\r$//' tests/map_capture_profile_test.mk
          make -f tests/map_capture_profile_test.mk map-capture-profile-test
          make -f tests/map_capture_profile_test.mk map-capture-profile-default-test
          make -f tests/map_capture_profile_test.mk map-capture-board-profile-test

      - name: Commissioning build (default-deny off)
        run: |
          make clean
          make EXTRA_CFLAGS="-DOEW_MAP_CAPTURE=1 -DOEW_MAP_L3=1 -DPWM_OEW_BOARD_REVISION=7 -DOEW_MAP_SYNTHETIC_PROFILE=1 -DOEW_HOST_TEST=1 -DOEW_HS1_COMMISSIONING_RELEASE=1"
          mkdir -p build-commissioning
          cp build/firmware.bin build-commissioning/firmware.bin
          cp build/firmware.elf build-commissioning/firmware.elf
          cp build/firmware.map build-commissioning/firmware.map
          python3 tools/test3_build_provenance_emit.py \
            --campaign-root build-commissioning \
            --source-sha "$(git rev-parse HEAD)" \
            --firmware build-commissioning/firmware.bin
          python3 tools/test3_build_provenance_check.py build-commissioning
          make clean
          make

      - name: Upload production firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware.bin
            build/firmware.elf
            build/firmware.map
          if-no-files-found: error

      - name: Upload commissioning firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-commissioning
          path: |
            build-commissioning/firmware.bin
            build-commissioning/firmware.elf
            build-commissioning/firmware.map
            build-commissioning/diagnostic_build.log
            build-commissioning/diagnostic_build_manifest.json
          if-no-files-found: error
