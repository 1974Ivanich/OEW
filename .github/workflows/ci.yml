name: build-test

# Автоматические ворота для всех веток: production build, hosted+QEMU тесты,
# commissioning build, pytest. Зелёный CI — обязательное условие приёмки
# (см. docs/AGENTS_WORKFLOW.md §5). Ложные «make PASS» из отчётов агентов
# здесь не проходят — сборка реальная, на Linux.

on:
  push:
    branches:
      - '**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история — нужна для Main push audit (родители merge-коммита)

      # Аудит push в main (AGENTS_WORKFLOW.md §1/§1a): изменения в main должны
      # приходить только merge-коммитом приёмки (>=2 родителей). Прямой push
      # ветки/коммита в main (1 родитель) — нарушение регламента, ран красный.
      - name: Main push audit (AGENTS_WORKFLOW §1)
        if: github.ref == 'refs/heads/main'
        run: |
          PARENTS=$(git log --format=%p -1 HEAD | wc -w)
          if [ "$PARENTS" -lt 2 ]; then
            echo "::error::Прямой push в main без merge-коммита приёмки (AGENTS_WORKFLOW.md §1/§1a)."
            echo "::error::Обязательно: ветка ai<N>/… → публикация → приёмка. Горячие фиксы — тоже через ветку."
            echo "::error::Приёмщик: изменения принимаются merge-коммитом (git merge --no-ff)."
            exit 1
          fi
          echo "main push audit: merge-коммит приёмки OK"

      - name: Install toolchain (arm-none-eabi, QEMU, pytest, Tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm python3-pytest python3-tk
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1

      - name: Normalize Makefile for Linux (CRLF -> LF, drop Windows PATH)
        run: |
          sed -i 's/\r$//' Makefile
          sed -i '/^export PATH :=/d' Makefile

      - name: Production build
        run: make

      - name: Hosted + QEMU + pytest tests
        run: make test QEMU=$(command -v qemu-system-arm)

      # Standalone host regression for the v2 map artifact writer (PR-2).
      # Deliberately NOT part of firmware C_SOURCES / main Makefile test
      # targets: the writer is a host-only artifact producer. The .mk uses
      # CRLF in the repo like the main Makefile, so normalize before make.
      - name: Map artifact writer regression (hosted standalone)
        run: |
          sed -i 's/\r$//' tools/map_artifact_writer_test.mk
          make -f tools/map_artifact_writer_test.mk map-artifact-test

      - name: Commissioning build (default-deny off)
        run: |
          make clean
          make EXTRA_CFLAGS="-DOEW_MAP_CAPTURE=1 -DOEW_MAP_L3=1 -DPWM_OEW_BOARD_REVISION=7"
          make clean
          make

      # Официальный production-образ = артефакт CI (docs/AGENTS_WORKFLOW.md §5).
      # Единый источник firmware.bin для всех ПК/агентов — исключает споры о
      # воспроизводимости между средами (разные тулчейны дают разные SHA).
      - name: Upload production firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware.bin
            build/firmware.elf
            build/firmware.map
          if-no-files-found: error
