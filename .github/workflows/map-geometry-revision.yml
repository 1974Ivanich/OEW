name: map-geometry-revision

on:
  push:
    branches:
      - ai4/map-region-geometry-revision
  pull_request:
    paths:
      - "src/current_map_selector.*"
      - "src/map_region_certifier.*"
      - "src/map_artifact_decoder.*"
      - "tools/map_artifact_writer.*"
      - "tools/map_geometry_interpolation_check.py"
      - "tests/map_region_geometry_test.c"
      - "tests/test_map_geometry_interpolation.py"

jobs:
  geometry-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile geometric region test
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -Isrc \
            src/map_region_certifier.c \
            src/current_map_selector.c \
            src/current_reconstruct.c \
            tests/map_region_geometry_test.c \
            -o /tmp/map_region_geometry_test
      - name: Run geometric region test
        run: /tmp/map_region_geometry_test
      - name: Python syntax check
        run: python3 -m py_compile tools/map_geometry_interpolation_check.py tests/test_map_geometry_interpolation.py
      - name: Run interpolation harness tests
        run: python3 -m pytest -q tests/test_map_geometry_interpolation.py
